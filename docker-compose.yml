# ============================================================
# SantaraBaru Roleplay — Docker Compose
# Layanan: open.mp server (SQLite Native), playit.gg tunnel
# ============================================================

volumes:
  server_data:
  playit_data:

services:

  # ── open.mp SA-MP Server ────────────────────────────────────
  omp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: santara_omp
    restart: unless-stopped
    network_mode: host
    environment:
      SAMP_PORT:     ${SAMP_PORT:-50034}
      VOICE_PORT:    ${VOICE_PORT:-39966}
      RCON_PASSWORD: ${RCON_PASSWORD:-SantaraRcon2024}
      SERVER_NAME:   ${SERVER_NAME}
      ARTWORK_CDN:   ${ARTWORK_CDN:-https://raw.githubusercontent.com/biomies/santarabaru/main/server/models}
    volumes:
      # Mount gamemodes supaya bisa edit & restart tanpa rebuild image
      - ./server/gamemodes:/server/gamemodes
      - ./server/include:/server/include:ro
      - ./server/scriptfiles:/server/scriptfiles
      - ./server/models:/server/models
      - server_data:/server/logs

  # ── playit.gg Tunnel Agent ──────────────────────────────────
  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.15
    container_name: santara_playit
    restart: unless-stopped
    depends_on:
      - omp-server
    network_mode: host
    environment:
      SECRET_KEY: ${PLAYIT_SECRET:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "$$SECRET_KEY" ]; then
          exec playit -s --secret "$$SECRET_KEY" --platform_docker start
        else
          exec playit -s --secret_path /etc/playit/playit.toml --platform_docker start
        fi
    volumes:
      - playit_data:/etc/playit

